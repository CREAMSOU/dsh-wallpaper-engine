name: issue-claim

on:
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [labeled, unlabeled, assigned, unassigned, closed, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

concurrency:
  group: issue-claim-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claim:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const policy = require('./.github/scripts/issue-claim-policy.cjs');
            try {
              if (context.eventName === 'issue_comment' && context.payload.action === 'created') {
                const claim = require('./.github/scripts/issue-claim.cjs');
                await claim.run({ github, context, core });
              }
            } finally {
              await policy.recheckIssue({ github, context, core, number: context.payload.issue.number });
            }
